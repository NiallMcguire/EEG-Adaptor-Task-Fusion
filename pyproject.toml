[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-task-fusion"
version = "0.1.0"
description = "Subject-paradigm hypernetworks for leakage-safe EEG adaptation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "mne>=1.6,<2", "pyriemann>=0.7,<1", "moabb>=1.2,<2", "PyYAML>=6,<7"]
model = ["torch>=2.2,<3", "braindecode>=1,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
eeg-fusion = "eeg_task_fusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]